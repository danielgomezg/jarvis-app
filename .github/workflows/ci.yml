name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, build y tests
    runs-on: ubuntu-latest # la máquina (gratis) que GitHub nos presta

    # Como es un monorepo, todos los comandos corren dentro de backend-jarvis/
    defaults:
      run:
        working-directory: backend-jarvis
    steps:
      # 1) Tomar el código del repo
      - name: Tomar el codigo del repo
        uses: actions/checkout@v4

      # 2) Instalar pnpm (misma versión que usás en tu PC)
      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      # 3) Instalar Node.js y activar caché (para que sea rápido)
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend-jarvis/pnpm-lock.yaml

      # 4) Instalar las librerías (exactas, según el lockfile)
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # 5) Lint — revisa estilo y reglas
      - name: Lint
        run: pnpm run lint

      # 6) Build — compila y detecta errores de tipos
      - name: Build
        run: pnpm run build

      # 7) Tests — los 69 tests unitarios (no necesitan base de datos)
      - name: Tests
        run: pnpm run test

      # 8) Opcional — auditoría de seguridad (avisa si una librería tiene
      #    vulnerabilidades; no bloquea el merge, solo informa)
      - name: Auditoría de seguridad
        run: pnpm audit --audit-level=high
        continue-on-error: true
